<meta charset="utf-8">
<title>Radar VT AHAL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: splash de marca → app con barra lateral (escritorio) / pestañas (móvil); una vista por sección, enrutada por #hash */
:root{
  --peach:#EDB295;      /* banda promocional AHAL */
  --cream:#F4EDE2;      /* barra de navegación AHAL */
  --bg:#FAF6EF;
  --surface:#FFFFFF;
  --ink:#1A1A1A;
  --muted:#6E5A49;
  --line:#E7DBCB;
  --accent:#873F04;     /* óxido / ámbar oscuro de la foto */
  --amber:#C58027;
  --caramel:#D19C66;
  --sand:#E1C5A1;
  --deep:#4E2505;
  --accent-soft:#F6E6D6;
  --on-accent:#FFFFFF;
  --good:#4F7A3A; --good-bg:#E5EEDC;
  --warn:#9A6400; --warn-bg:#F7EACB;
  --bad:#8E3B2E; --bad-bg:#F4DCD6;
  --neutral-bg:#EFE8DE;
  --f-display:"Poppins",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Inter",ui-sans-serif,system-ui,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cream:#1F1812; --bg:#16110D; --surface:#211A14; --ink:#F4EDE2; --muted:#BFA88E; --line:#3A2E24;
  --accent:#D19C66; --accent-soft:#3A2A1C; --on-accent:#1A1A1A; --deep:#E1C5A1;
  --good:#9DC27F; --good-bg:#26331E; --warn:#E3B45A; --warn-bg:#3A2D14; --bad:#E39A8A; --bad-bg:#3D2420; --neutral-bg:#2C241D;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --cream:#1F1812; --bg:#16110D; --surface:#211A14; --ink:#F4EDE2; --muted:#BFA88E; --line:#3A2E24;
  --accent:#D19C66; --accent-soft:#3A2A1C; --on-accent:#1A1A1A; --deep:#E1C5A1;
  --good:#9DC27F; --good-bg:#26331E; --warn:#E3B45A; --warn-bg:#3A2D14; --bad:#E39A8A; --bad-bg:#3D2420; --neutral-bg:#2C241D;
  color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;font-weight:600}
a{color:var(--accent)}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.tabnum{font-variant-numeric:tabular-nums}

/* ---------- Splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:var(--peach);color:#1A1A1A;display:grid;place-items:center;cursor:pointer;
  transition:opacity .7s ease, transform .8s cubic-bezier(.7,0,.2,1);padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px))}
#splash.out{opacity:0;transform:translateY(-4%);pointer-events:none}
#splash .inner{text-align:center;display:grid;gap:18px;justify-items:center;position:relative;z-index:1}
.wordmark{font-family:var(--f-display);font-weight:500;letter-spacing:.42em;font-size:clamp(56px,13vw,148px);line-height:1;margin-right:-.42em}
.wordmark-bar{height:clamp(4px,.8vw,8px);width:min(78vw,560px);background:#1A1A1A;transform-origin:left;animation:bar 1.1s .35s cubic-bezier(.6,0,.2,1) both}
.wordmark span{display:inline-block;animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.wordmark span:nth-child(2){animation-delay:.08s}.wordmark span:nth-child(3){animation-delay:.16s}.wordmark span:nth-child(4){animation-delay:.24s}
.splash-tag{font-family:var(--f-display);font-size:clamp(14px,2vw,18px);letter-spacing:.06em;animation:fade 1s .9s both}
.splash-meta{font-size:13px;opacity:.75;animation:fade 1s 1.2s both;min-height:20px}
.splash-hint{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;z-index:1}
#splash svg.leaves{position:absolute;inset:0;width:100%;height:100%;opacity:.55}
#splash svg.leaves path{fill:none;stroke:#873F04;stroke-width:1.4;stroke-dasharray:900;stroke-dashoffset:900;animation:draw 2.4s .2s ease forwards}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes rise{from{opacity:0;transform:translateY(30%)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){#splash *,#splash{animation:none!important;transition:none!important}#splash svg.leaves path{stroke-dashoffset:0}}

/* ---------- App shell ---------- */
.promo{background:var(--peach);color:#1A1A1A;overflow:hidden;white-space:nowrap;font-family:var(--f-display);font-weight:600;font-size:12.5px}
.promo-track{display:inline-flex;gap:56px;padding:7px 0;animation:marquee 40s linear infinite}
.promo:hover .promo-track{animation-play-state:paused}
@keyframes marquee{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion: reduce){.promo-track{animation:none}}
header.top{background:var(--cream);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:21;background:var(--cream)}
.top-inner{display:flex;align-items:center;gap:20px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));flex-wrap:wrap}
.logo{display:inline-grid;justify-items:center;text-decoration:none;color:var(--ink)}
.logo b{font-family:var(--f-display);font-weight:500;letter-spacing:.32em;font-size:24px;line-height:1;margin-right:-.32em}
.logo i{display:block;height:3px;width:100%;background:var(--ink);margin-top:4px}
.top-title{display:grid;line-height:1.25;min-width:0}
.top-title strong{font-family:var(--f-display);font-size:17px;font-weight:600}
.top-title span{color:var(--muted);font-size:12.5px}
.top-tools{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
select,.input{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;color:var(--ink);max-width:100%}
.layout{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:calc(100% - 100px);background:linear-gradient(to right,var(--cream) 232px,var(--bg) 232px)}
nav.side{border-right:1px solid var(--line);background:var(--cream);padding:18px 0;position:sticky;top:calc(var(--hdr,64px) + env(safe-area-inset-top,0px));align-self:start;height:calc(100vh - var(--hdr,64px))}
nav.side a{display:flex;align-items:center;gap:12px;padding:11px 22px;color:var(--ink);text-decoration:none;font-family:var(--f-display);font-size:14px;font-weight:500;border-left:3px solid transparent}
nav.side a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6}
nav.side a:hover{background:var(--accent-soft)}
nav.side a[aria-current="page"]{background:var(--accent);color:var(--on-accent);border-left-color:var(--deep)}
.side-foot{padding:22px;color:var(--muted);font-size:12px;line-height:1.5}
main{min-width:0;padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:900px){main{padding-left:32px;padding-right:max(32px,env(safe-area-inset-right,0px))}}
.view{display:grid;gap:22px;max-width:1280px;animation:fade .35s ease}
.view-head{display:grid;gap:4px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:600}
.view-head h1{font-size:clamp(22px,3vw,30px)}
.view-head p{margin:0;color:var(--muted);max-width:72ch}
@media (max-width:899px){
  .layout{grid-template-columns:1fr;background:var(--bg)}
  nav.side{position:sticky;top:calc(var(--hdr,104px) + env(safe-area-inset-top,0px));z-index:15;height:auto;display:flex;overflow-x:auto;padding:0;border-right:0;border-bottom:1px solid var(--line)}
  nav.side a{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:11px 14px}
  nav.side a[aria-current="page"]{border-bottom-color:var(--deep)}
  .side-foot{display:none}
  .top-title span{display:none}
}

/* ---------- Common blocks ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;min-width:0}
.kpi .k-label{font-size:12px;color:var(--muted)}
.kpi .k-val{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;overflow-wrap:anywhere;line-height:1.25}
.kpi .k-sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel h2{font-size:16px;margin-bottom:2px}
.panel .sub{color:var(--muted);font-size:12.5px;margin:0 0 12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px}
.table-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-weight:600;text-align:left;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line);padding:9px 10px;vertical-align:top}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-good{background:var(--good-bg);color:var(--good)} .p-warn{background:var(--warn-bg);color:var(--warn)}
.p-bad{background:var(--bad-bg);color:var(--bad)} .p-neutral{background:var(--neutral-bg);color:var(--muted)}
.p-accent{background:var(--accent-soft);color:var(--accent)}
.bar-row{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 54px;gap:10px;align-items:center;font-size:12.5px;padding:3px 0}
.bar-row .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-track{height:12px;background:var(--neutral-bg);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--amber);border-radius:3px}
.bar-row .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.note{font-size:12.5px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--caramel)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn-primary:hover{filter:brightness(1.08)}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;padding:8px 10px;border-radius:8px;max-width:320px;line-height:1.4;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.spark path{fill:none;stroke:var(--accent);stroke-width:1.6}
.spark .area{fill:var(--accent-soft);stroke:none}

/* ---------- Opportunities ---------- */
.opp-name{font-weight:600;font-family:var(--f-display)}
tr.is-current td{background:var(--accent-soft)}

/* ---------- Scatter (estilo Orange) ---------- */
.orange{display:grid;grid-template-columns:260px minmax(0,1fr);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.o-ctrl{background:var(--cream);border-right:1px solid var(--line);padding:12px;display:grid;gap:12px;align-content:start;font-size:12.5px}
.o-box{border:1px solid var(--line);border-radius:6px;padding:10px 10px 8px;position:relative;display:grid;gap:8px;background:var(--surface)}
.o-box > .o-legend{position:absolute;top:-9px;left:8px;background:var(--cream);padding:0 4px;font-size:12px;color:var(--muted)}
.o-row{display:grid;grid-template-columns:62px minmax(0,1fr);align-items:center;gap:6px}
.o-row select{padding:4px 6px;font-size:12px;width:100%}
.o-n{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:3px;background:var(--bad);color:#fff;font-size:10px;font-weight:700;margin-right:4px;vertical-align:-2px}
.o-sel{position:relative}
.o-sel .o-n{position:absolute;left:6px;top:50%;transform:translateY(-50%);pointer-events:none}
.o-sel select{padding-left:26px}
.o-slider{display:grid;grid-template-columns:96px minmax(0,1fr);align-items:center;gap:6px}
.o-slider input{width:100%;accent-color:var(--accent)}
.o-check{display:flex;gap:8px;align-items:center;cursor:pointer}
.o-check input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.o-btn{width:100%;padding:6px;border:1px solid var(--caramel);background:var(--surface);border-radius:4px;cursor:pointer;font-size:12.5px}
.o-btn:hover{background:var(--accent-soft)}
.o-tools{display:flex;gap:6px}
.o-tool{width:32px;height:30px;border:1px solid var(--line);background:var(--surface);border-radius:4px;display:grid;place-items:center;cursor:pointer}
.o-tool[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.o-tool svg{width:16px;height:16px;stroke:var(--ink);fill:none;stroke-width:1.7}
.o-plot{position:relative;min-width:0;display:grid;grid-template-rows:minmax(0,1fr) auto}
.o-plot canvas{display:block;width:100%;height:clamp(360px,58vh,600px);cursor:crosshair;touch-action:none}
.o-status{display:flex;gap:16px;align-items:center;border-top:1px solid var(--line);padding:6px 12px;font-size:12px;color:var(--muted);background:var(--cream);flex-wrap:wrap}
.o-msg{color:var(--accent);font-weight:500}
@media (max-width:760px){.orange{grid-template-columns:1fr}.o-ctrl{border-right:0;border-bottom:1px solid var(--line);grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}}

/* ---------- Heatmap ---------- */
.heat{display:grid;gap:2px;font-size:11px;min-width:640px}
.heat .h-row{display:grid;grid-template-columns:150px repeat(var(--cols),minmax(0,1fr));gap:2px;align-items:center}
.heat .h-lbl{color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:6px}
.heat .h-cell{height:22px;border-radius:2px}
.heat .h-yr{color:var(--muted);text-align:center;font-size:10px}

/* ---------- Cerebro ---------- */
.brain{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:1050px){.brain{grid-template-columns:1fr}}
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:grid;grid-template-rows:minmax(0,1fr) auto;height:min(76vh,780px);min-height:480px;overflow:hidden}
.chat-log{overflow-y:auto;padding:20px;display:grid;gap:16px;align-content:start}
.msg-q{justify-self:end;max-width:min(560px,90%);background:var(--accent);color:var(--on-accent);padding:11px 16px;border-radius:14px 14px 4px 14px}
.msg-a{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;max-width:880px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center}
.avatar svg{width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.5}
.bubble{background:var(--cream);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.bubble h3{font-size:14px}
.bubble p{margin:0}
.bubble .src{font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.bubble table{background:var(--surface);border-radius:6px}
.evid{display:grid;gap:8px}
.evid-item{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 11px;font-size:12.5px}
.evid-item a{font-weight:600;text-decoration:none}
.evid-item a:hover{text-decoration:underline}
.evid-item .meta{color:var(--muted);font-size:11.5px}
mark{background:var(--sand);color:#1A1A1A;border-radius:2px;padding:0 2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none}
.chip{border:1px solid var(--caramel);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;text-align:left}
.chip:hover{background:var(--accent-soft)}
.composer{border-top:1px solid var(--line);padding:12px;display:grid;gap:10px;background:var(--surface)}
.composer form{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.inbox{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:0 6px 0 12px}
.inbox input{border:0;background:transparent;flex:1;min-width:0;padding:11px 0;outline:none}
.inbox:focus-within{border-color:var(--amber)}
.icon-btn{border:0;background:transparent;cursor:pointer;padding:6px;border-radius:6px;display:grid;place-items:center}
.icon-btn svg{width:19px;height:19px;stroke:var(--muted);fill:none;stroke-width:1.6}
.icon-btn:hover{background:var(--accent-soft)}
.files{display:grid;gap:12px;align-content:start}
.files .panel{padding:16px}
.file-list{display:grid;max-height:420px;overflow-y:auto;margin:0 -4px;padding:0 4px}
.file{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.file:last-child{border-bottom:0}
.ficon{width:30px;height:34px;border-radius:4px;display:grid;place-items:center;font-size:9px;font-weight:700;color:#1A1A1A}
.ficon.c{background:var(--sand)} .ficon.p{background:var(--peach)} .ficon.u{background:var(--caramel)}
.file .fn{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file .fs{font-size:11.5px;color:var(--muted)}
.ok{width:20px;height:20px;border-radius:50%;background:var(--good);display:grid;place-items:center}
.ok svg{width:12px;height:12px;stroke:var(--surface);fill:none;stroke-width:2.6}
.drop{border:1.5px dashed var(--caramel);border-radius:10px;padding:16px;text-align:center;display:grid;gap:8px;justify-items:center;color:var(--muted);font-size:12.5px;cursor:pointer}
.drop.over{background:var(--accent-soft);border-color:var(--accent)}
.drop strong{color:var(--ink);font-weight:600}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--caramel);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{50%{opacity:.25}}
.search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-row .input{flex:1;min-width:200px}
.doc-list{display:grid;gap:8px}
</style>

<div id="splash" role="button" tabindex="0" aria-label="Entrar al radar AHAL">
  <svg class="leaves" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
    <path d="M-20 760 C 120 640, 180 520, 160 360 C 150 260, 200 180, 260 120"/>
    <path d="M160 360 C 90 330, 60 270, 70 210 C 130 230, 160 290, 160 360"/>
    <path d="M175 470 C 250 450, 300 400, 310 330 C 240 340, 190 390, 175 470"/>
    <path d="M150 560 C 80 560, 30 520, 10 460 C 80 455, 130 495, 150 560"/>
    <path d="M1220 40 C 1090 140, 1040 260, 1060 420 C 1070 520, 1030 610, 960 680"/>
    <path d="M1060 420 C 1130 450, 1170 510, 1165 570 C 1100 555, 1065 500, 1060 420"/>
    <path d="M1050 300 C 980 310, 930 270, 910 200 C 980 200, 1035 240, 1050 300"/>
    <path d="M1040 560 C 990 600, 930 600, 880 570 C 930 530, 995 530, 1040 560"/>
  </svg>
  <div class="inner">
    <div class="wordmark" aria-hidden="true"><span>A</span><span>H</span><span>A</span><span>L</span></div>
    <div class="wordmark-bar" aria-hidden="true"></div>
    <div class="splash-tag">Radar de vigilancia tecnológica · cosmética herbolaria mexicana</div>
    <div class="splash-meta" id="splashMeta">Cargando patentes y ciencia…</div>
  </div>
  <div class="splash-hint">Toca para entrar</div>
</div>

<div class="promo" aria-hidden="true"><div class="promo-track" id="promo"></div></div>
<header class="top" id="hdr">
  <div class="top-inner">
    <a class="logo" href="#oportunidades" aria-label="AHAL, inicio"><b>AHAL</b><i></i></a>
    <div class="top-title"><strong>Radar VT · AHAL Innovación</strong><span>Vigilancia tecnológica para cosmética herbolaria mexicana</span></div>
    <div class="top-tools">
      <label class="field" for="ingSel">Ingrediente:
        <select id="ingSel"><option value="all">Todos los ingredientes</option></select>
      </label>
    </div>
  </div>
</header>
<div class="layout">
  <nav class="side" id="nav" aria-label="Secciones">
    <a href="#oportunidades" data-v="oportunidades"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Oportunidades</a>
    <a href="#explorador" data-v="explorador"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 17.5h7M17.5 14v7"/></svg>Explorador de patentes</a>
    <a href="#ciencia" data-v="ciencia"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"/><path d="M7 15h10"/></svg>Explorador de ciencia</a>
    <a href="#calidad" data-v="calidad"><svg viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Calidad de investigación</a>
    <a href="#cerebro" data-v="cerebro"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3c-3 3-3 15 0 18M12 3c3 3 3 15 0 18M3.5 9h17M3.5 15h17"/></svg>El Cerebro</a>
    <div class="side-foot" id="sideFoot"></div>
  </nav>
  <main id="main"></main>
</div>
<div id="tip" hidden></div>

<script>
(() => {
"use strict";
/* ================= Utilidades ================= */
const $ = (s, el = document) => el.querySelector(s);
const fmt = n => (n == null || isNaN(n)) ? "–" : Number(n).toLocaleString("es-MX");
const pct = (a, b) => b ? Math.round(100 * a / b) + "%" : "–";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const NOW_YEAR = 2026;

const JUR = {US:"EE. UU.",WO:"PCT (OMPI)",EP:"Europa (EPO)",CN:"China",KR:"Corea",JP:"Japón",MX:"México",RU:"Rusia",GB:"Reino Unido",CA:"Canadá",FR:"Francia",DE:"Alemania",ES:"España",AU:"Australia",RO:"Rumania",IT:"Italia",BG:"Bulgaria",HU:"Hungría",PH:"Filipinas",TW:"Taiwán",MY:"Malasia",BR:"Brasil",IN:"India",ZA:"Sudáfrica",AR:"Argentina",CO:"Colombia",CL:"Chile"};
const LEGAL_ES = {ACTIVE:["Activa","p-good"],PATENTED:["Patentada","p-good"],PENDING:["En trámite","p-warn"],INACTIVE:["Inactiva","p-neutral"],DISCONTINUED:["Abandonada","p-bad"],EXPIRED:["Expirada","p-neutral"],UNKNOWN:["Sin dato","p-neutral"]};
const TYPE_ES = {"Patent Application":"Solicitud","Granted Patent":"Patente concedida","Search Report":"Informe de búsqueda","Amended Application":"Solicitud enmendada","Limited Patent":"Patente limitada","Amended Patent":"Patente enmendada","Statutory Invention Registration":"Registro de invención","Design Right":"Diseño","Unknown":"Otro"};
const CPC = {A61K:"Preparaciones cosméticas o médicas",A61Q:"Uso específico de cosméticos",A61P:"Actividad terapéutica",A23L:"Alimentos y bebidas",A23V:"Indexación alimentaria",C12N:"Microorganismos y enzimas",C07C:"Compuestos orgánicos acíclicos",A01N:"Biocidas y conservación",C12P:"Fermentación",C11D:"Detergentes",C08G:"Polímeros",C07K:"Péptidos",A61L:"Esterilización y materiales",A23K:"Alimento animal",C08L:"Composiciones de polímeros",Y02A:"Adaptación climática",A23G:"Cacao, chocolate y confitería",C07D:"Compuestos heterocíclicos",A23P:"Conformado de alimentos",C09B:"Colorantes",A23C:"Lácteos",A23D:"Aceites comestibles",A45D:"Peluquería y cuidado personal",B01D:"Separación y filtración",C08K:"Aditivos de polímeros",A61M:"Dispositivos de administración",C11B:"Aceites y grasas",G01N:"Análisis de materiales",C12Y:"Enzimas",A61F:"Apósitos y prótesis",C09D:"Recubrimientos y tintas",B01J:"Procesos químicos y adsorbentes",C01B:"Carbón y no metales",B65D:"Envases",C09K:"Materiales diversos",A23B:"Conservación de alimentos",A01H:"Nuevas plantas",A23J:"Proteínas alimentarias",Y10T:"Indexación técnica",Y10S:"Indexación técnica",C12R:"Indexación microbiológica"};
const isGranted = d => d.type === "Granted Patent";
const isAlive = d => d.legal === "ACTIVE" || d.legal === "PATENTED" || d.legal === "PENDING";

/* ================= Datos ================= */
const S = { docs: [], files: [], ings: [], byLens: new Map(), view: null, ing: "all", ready: false };

function loadData(raw) {
  const F = raw.fields;
  S.ings = raw.ingredients.slice();
  S.docs = raw.docs.map(r => {
    const d = {}; F.forEach((f, i) => d[f] = r[i]);
    d.type = raw.types[d.type]; d.legal = raw.legal[d.legal];
    return d;
  });
  S.docs.forEach((d, i) => S.byLens.set(d.lens, i));
  S.files = raw.files.map(f => ({...f, uploaded: false}));
}
function docsFor(ds, ing) {           // ds: "ciencia" | "patente" | "all"; ing: index | "all"
  const set = new Set();
  for (const f of S.files) {
    if (ds !== "all" && f.ds !== ds) continue;
    if (ing !== "all" && f.ing !== +ing) continue;
    for (const i of f.docs) set.add(i);
  }
  return [...set].map(i => S.docs[i]);
}
function count(arr, key, split) {
  const m = new Map();
  for (const d of arr) {
    const vals = split ? String(key(d) || "").split(split).map(s => s.trim()).filter(Boolean) : [key(d)];
    for (const v of vals) if (v !== "" && v != null) m.set(v, (m.get(v) || 0) + 1);
  }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
const byYear = arr => { const m = {}; for (const d of arr) if (d.year) m[d.year] = (m[d.year] || 0) + 1; return m; };
const firstApp = d => (d.app || "").split(" ; ")[0];

/* ================= Gráficas pequeñas (SVG) ================= */
function lineChart(series, o = {}) {
  const W = o.w || 640, H = o.h || 220, P = {l: 40, r: 14, t: 12, b: 26};
  const y0 = o.y0 || 2000, y1 = o.y1 || NOW_YEAR;
  const years = []; for (let y = y0; y <= y1; y++) years.push(y);
  const maxV = Math.max(1, ...series.flatMap(s => years.map(y => s.data[y] || 0)));
  const nice = niceMax(maxV);
  const x = y => P.l + (y - y0) / Math.max(1, (y1 - y0)) * (W - P.l - P.r);
  const yv = v => H - P.b - v / nice * (H - P.t - P.b);
  let g = "";
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4, yy = yv(v); g += `<line x1="${P.l}" x2="${W - P.r}" y1="${yy}" y2="${yy}" stroke="var(--line)" stroke-width="1"/><text x="${P.l - 6}" y="${yy + 4}" text-anchor="end">${fmt(Math.round(v))}</text>`; }
  const step = Math.ceil((y1 - y0) / 8);
  for (let y = y0; y <= y1; y += step) g += `<text x="${x(y)}" y="${H - 8}" text-anchor="middle">${y}</text>`;
  series.forEach((s, si) => {
    const full = years.filter(y => y < NOW_YEAR), pts = full.map(y => [x(y), yv(s.data[y] || 0)]);
    if (s.area) g += `<path d="M${pts[0][0]},${yv(0)} L${pts.map(p => p.join(",")).join(" L")} L${pts[pts.length - 1][0]},${yv(0)} Z" fill="${s.color}" opacity=".18"/>`;
    g += `<path d="M${pts.map(p => p.join(",")).join(" L")}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    if (y1 >= NOW_YEAR) { const a = [x(NOW_YEAR - 1), yv(s.data[NOW_YEAR - 1] || 0)], b = [x(NOW_YEAR), yv(s.data[NOW_YEAR] || 0)]; g += `<path d="M${a} L${b}" stroke="${s.color}" stroke-width="2" stroke-dasharray="3 3" fill="none"/>`; }
    const last = pts[pts.length - 1]; g += `<circle cx="${last[0]}" cy="${last[1]}" r="3.5" fill="${s.color}"/>`;
    full.forEach(y => { g += `<circle cx="${x(y)}" cy="${yv(s.data[y] || 0)}" r="7" fill="transparent" data-tip="${esc(s.name)} · ${y}: ${fmt(s.data[y] || 0)} docs"/>`; });
  });
  let leg = "";
  if (series.length > 1) leg = `<div style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px">${series.map(s => `<span style="display:inline-flex;gap:6px;align-items:center"><i style="width:12px;height:3px;background:${s.color};display:inline-block"></i>${esc(s.name)}</span>`).join("")}</div>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || "Documentos por año")}">${g}</svg>${leg}<div class="note" style="margin-top:4px">Línea punteada: ${NOW_YEAR} todavía en curso.</div></div>`;
}
function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p; return 10 * p; }
function bars(items, o = {}) {
  const max = Math.max(1, ...items.map(i => i[1]));
  return `<div>${items.map(([l, v, sub]) => `<div class="bar-row" data-tip="${esc(l)}${sub ? " · " + esc(sub) : ""}: ${fmt(v)}"><span class="lbl">${esc(l)}</span><span class="bar-track"><span class="bar-fill" style="display:block;width:${(v / max * 100).toFixed(1)}%;background:${o.color || "var(--amber)"}"></span></span><span class="v">${fmt(v)}</span></div>`).join("")}</div>`;
}
function spark(data, y0 = 2006, y1 = NOW_YEAR - 1) {
  const W = 120, H = 30, vals = []; for (let y = y0; y <= y1; y++) vals.push(data[y] || 0);
  const m = Math.max(1, ...vals), pts = vals.map((v, i) => [(i / (vals.length - 1) * W).toFixed(1), (H - 2 - v / m * (H - 4)).toFixed(1)]);
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><path class="area" d="M0,${H} L${pts.map(p => p.join(",")).join(" L")} L${W},${H} Z"/><path d="M${pts.map(p => p.join(",")).join(" L")}"/></svg>`;
}
function legalPill(l) { const [t, c] = LEGAL_ES[l] || [l, "p-neutral"]; return `<span class="pill ${c}">${t}</span>`; }
function docRow(d) {
  return `<tr><td class="num">${d.year || "–"}</td><td>${esc(d.jur)}</td><td style="min-width:260px"><a href="https://lens.org/${esc(d.lens)}" target="_blank" rel="noopener">${esc(d.title || "(sin título)")}</a></td><td style="min-width:160px">${esc(firstApp(d)) || "–"}</td><td class="num">${fmt(d.fam)}</td><td class="num">${fmt(d.citedBy)}</td><td>${legalPill(d.legal)}</td></tr>`;
}
const docTableHead = `<thead><tr><th class="num">Año</th><th>Oficina</th><th>Título</th><th>Solicitante</th><th class="num">Familia</th><th class="num">Citada por</th><th>Estado</th></tr></thead>`;
const ingName = i => i === "all" ? "todos los ingredientes" : S.ings[+i];

/* ================= Navegación ================= */
const VIEWS = { oportunidades: renderOpp, explorador: renderPatents, ciencia: renderScience, calidad: renderQuality, cerebro: renderBrain };
function route() {
  if (!S.ready) return;
  let v = location.hash.slice(1);
  if (!VIEWS[v]) v = "oportunidades";
  S.view = v;
  document.querySelectorAll("#nav a[data-v]").forEach(a => { if (a.dataset.v === v) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  const main = $("#main"); main.innerHTML = ""; cleanupScatter();
  VIEWS[v](main);
  window.scrollTo({top: 0});
}
window.addEventListener("hashchange", route);
$("#ingSel").addEventListener("change", e => { S.ing = e.target.value; SC.sel.clear(); SC.view = null; SC.msg = ""; route(); });
function fillIngSelect() {
  const sel = $("#ingSel"), cur = sel.value;
  sel.innerHTML = `<option value="all">Todos los ingredientes</option>` + S.ings.map((n, i) => `<option value="${i}">${esc(n)}</option>`).join("");
  sel.value = [...sel.options].some(o => o.value === cur) ? cur : "all";
}
function updateChrome() {
  const nP = docsFor("patente", "all").length, nC = docsFor("ciencia", "all").length;
  const items = [`${fmt(S.docs.length)} documentos únicos analizados`, `${S.ings.length} ingredientes de la herbolaria`, `${fmt(nP)} registros en PATENTES`, `${fmt(nC)} registros en CIENCIA`, `${S.files.length} archivos CSV conectados al Cerebro`, `Fuente: exportaciones de The Lens`];
  $("#promo").innerHTML = [...items, ...items].map(t => `<span>${esc(t)}</span>`).join("");
  $("#sideFoot").innerHTML = `${S.files.length} archivos · ${fmt(S.docs.length)} documentos<br>Datos: The Lens (lens.org)`;
  document.documentElement.style.setProperty("--hdr", $("#hdr").offsetHeight + "px");
}

/* ================= Tooltip global ================= */
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest && e.target.closest("[data-tip]");
  if (!t) { if (!tip.dataset.lock) tip.hidden = true; return; }
  showTip(t.getAttribute("data-tip"), e.clientX, e.clientY);
});
function showTip(html, x, y, isHtml) {
  tip[isHtml ? "innerHTML" : "textContent"] = html; tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(window.innerWidth - r.width - 8, x + 14) + "px";
  tip.style.top = Math.max(8, (y + 16 + r.height > window.innerHeight ? y - r.height - 12 : y + 16)) + "px";
}

/* ================= Oportunidades ================= */
function oppRows() {
  return S.ings.map((name, i) => {
    let ds = docsFor("patente", i); const fromPat = ds.length > 0;
    if (!fromPat) ds = docsFor("ciencia", i);
    const by = byYear(ds);
    let recent = 0, prior = 0; for (let y = 2021; y <= 2025; y++) recent += by[y] || 0; for (let y = 2016; y <= 2020; y++) prior += by[y] || 0;
    const growth = (recent + 1) / (prior + 1);
    const alive = ds.filter(isAlive).length, mx = ds.filter(d => d.mx).length;
    const topJur = count(ds, d => d.jur)[0];
    const capped = S.files.some(f => f.ing === i && f.rows >= 1000);
    return {i, name, n: ds.length, recent, prior, growth, alive, mx, by, fromPat, topJur: topJur ? topJur[0] : "–", capped};
  });
}
function classify(rows) {
  const med = [...rows.map(r => r.recent)].sort((a, b) => a - b)[Math.floor(rows.length / 2)];
  rows.forEach(r => {
    if (r.recent < med && r.growth >= 1.2) r.cls = ["Espacio blanco", "p-good"];
    else if (r.recent >= med && r.growth >= 1.2) r.cls = ["En auge", "p-warn"];
    else if (r.recent >= med) r.cls = ["Maduro / saturado", "p-bad"];
    else r.cls = ["Nicho estable", "p-neutral"];
    r.score = Math.round(Math.min(100, (Math.min(r.growth, 3) / 3) * 55 + (1 - Math.min(r.recent, 600) / 600) * 30 + Math.min(r.mx, 40) / 40 * 15));
  });
  return rows;
}
function renderOpp(main) {
  const rows = classify(oppRows()).sort((a, b) => b.score - a.score);
  const all = S.docs, by = byYear(all);
  const peak = Object.entries(by).filter(([y]) => +y < NOW_YEAR).sort((a, b) => b[1] - a[1])[0];
  const best = rows[0];
  main.innerHTML = `<section class="view">
    <div class="view-head"><span class="eyebrow">Inicio</span><h1>Oportunidades por ingrediente</h1>
    <p>Comparamos la actividad de patentes de 2021–2025 contra 2016–2020 para cada ingrediente de la herbolaria AHAL. Un ingrediente con poca actividad pero en crecimiento es un espacio blanco: hay interés y todavía poca competencia.</p></div>
    <div class="kpis">
      <div class="kpi"><span class="k-label">Documentos únicos</span><span class="k-val">${fmt(all.length)}</span><span class="k-sub">${S.files.length} archivos CSV</span></div>
      <div class="kpi"><span class="k-label">Mayor puntaje de oportunidad</span><span class="k-val">${esc(best.name)}</span><span class="k-sub">${best.score}/100 · ${best.cls[0]}</span></div>
      <div class="kpi"><span class="k-label">Con familia en México</span><span class="k-val">${fmt(all.filter(d => d.mx).length)}</span><span class="k-sub">${pct(all.filter(d => d.mx).length, all.length)} del total</span></div>
      <div class="kpi"><span class="k-label">Año con más publicaciones</span><span class="k-val">${peak ? peak[0] : "–"}</span><span class="k-sub">${peak ? fmt(peak[1]) + " documentos" : ""}</span></div>
    </div>
    <div class="panel"><h2>Matriz de oportunidad</h2><p class="sub">Puntaje 0–100 = crecimiento (55%) + baja saturación (30%) + presencia en México (15%). Ordenado de mayor a menor.</p>
    <div class="table-wrap"><table><thead><tr><th>Ingrediente</th><th>Clasificación</th><th class="num">Puntaje</th><th class="num">Docs.</th><th class="num">2016–20</th><th class="num">2021–25</th><th class="num">Crecimiento</th><th class="num">Vigentes</th><th class="num">En MX</th><th>Oficina líder</th><th>2006–2025</th></tr></thead><tbody>
    ${rows.map(r => `<tr class="${S.ing !== "all" && +S.ing === r.i ? "is-current" : ""}"><td class="opp-name">${esc(r.name)}${r.fromPat ? "" : ` <span class="pill p-neutral" title="Sin archivo de patentes; se usa CIENCIA">solo ciencia</span>`}</td><td><span class="pill ${r.cls[1]}">${r.cls[0]}</span></td><td class="num"><strong>${r.score}</strong></td><td class="num">${fmt(r.n)}${r.capped ? `<span title="La exportación llegó al tope de 1,000 registros" style="color:var(--warn)"> ▲</span>` : ""}</td><td class="num">${fmt(r.prior)}</td><td class="num">${fmt(r.recent)}</td><td class="num">×${r.growth.toFixed(1)}</td><td class="num">${pct(r.alive, r.n)}</td><td class="num">${fmt(r.mx)}</td><td>${esc(JUR[r.topJur] || r.topJur)}</td><td>${spark(r.by)}</td></tr>`).join("")}
    </tbody></table></div><p class="note" style="margin-top:10px">▲ La búsqueda llegó al tope de 1,000 registros de The Lens; el conteo real puede ser mayor. Revisa “Calidad de investigación”.</p></div>
    <div class="grid2">
      <div class="panel"><h2>Publicaciones por año, todos los ingredientes</h2><p class="sub">Documentos únicos de PATENTES y CIENCIA</p>${lineChart([{name: "Todos", color: css("--accent"), data: by, area: true}], {y0: 1995})}</div>
      <div class="panel"><h2>Crecimiento 2021–25 vs 2016–20</h2><p class="sub">Veces que creció la actividad</p>${bars(rows.slice().sort((a, b) => b.growth - a.growth).map(r => [r.name, +r.growth.toFixed(1)]), {color: "var(--caramel)"}).replace(/>(\d+(\.\d)?)<\/span><\/div>/g, ">×$1</span></div>")}</div>
    </div></section>`;
}

/* ================= Explorador de patentes (gráfica tipo Orange) ================= */
const SVARS = [
  {k: "year", l: "Año_publicación", count: false}, {k: "prio", l: "Año_prioridad", count: false},
  {k: "fam", l: "Familia_simple", count: true}, {k: "extFam", l: "Familia_extendida", count: true},
  {k: "famJur", l: "Países_en_familia", count: true}, {k: "citedBy", l: "Citada_por", count: true},
  {k: "cites", l: "Citas_a_patentes", count: true}, {k: "npl", l: "Citas_literatura_NPL", count: true}];
const RAMP = ["#4E2505", "#873F04", "#C58027", "#D19C66", "#EDB295"];
const SC = {x: "fam", y: "famJur", c: "year", s: "none", size: 6, op: 70, jit: 8, regions: true, legend: true, grid: false, reg: true, ellipse: false, log: true, tool: "select", view: null, sel: new Set(), msg: ""};
let scatterCleanup = null;
function cleanupScatter() { if (scatterCleanup) { scatterCleanup(); scatterCleanup = null; } tip.hidden = true; }
function rampColor(t) {
  t = Math.max(0, Math.min(1, t)); const p = t * (RAMP.length - 1), i = Math.min(RAMP.length - 2, Math.floor(p)), f = p - i;
  const a = hex(RAMP[i]), b = hex(RAMP[i + 1]); return [0, 1, 2].map(k => Math.round(a[k] + (b[k] - a[k]) * f));
}
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
function renderPatents(main) {
  const opt = (sel) => SVARS.map(v => `<option value="${v.k}" ${v.k === sel ? "selected" : ""}>${v.l}</option>`).join("");
  main.innerHTML = `<section class="view">
    <div class="view-head"><span class="eyebrow">Patentes</span><h1>Explorador de patentes</h1>
    <p>Cada punto es una patente de los archivos PATENTES para <strong>${esc(ingName(S.ing))}</strong>. Elige los ejes, el color y el tamaño; arrastra sobre la gráfica para seleccionar patentes y verlas en la tabla.</p></div>
    <div class="kpis" id="pKpis"></div>
    <div class="orange">
      <div class="o-ctrl">
        <div class="o-box"><span class="o-legend">Ejes</span>
          <div class="o-row"><label for="sx">Eje x:</label><span class="o-sel"><span class="o-n">N</span><select id="sx">${opt(SC.x)}</select></span></div>
          <div class="o-row"><label for="sy">Eje y:</label><span class="o-sel"><span class="o-n">N</span><select id="sy">${opt(SC.y)}</select></span></div>
          <button class="o-btn" id="sFind" type="button">Buscar proyecciones informativas</button>

function parseCSV(text) {
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }

    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length) { row.push(f); rows.push(row); }
  return rows;
}
